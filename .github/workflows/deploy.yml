name: GitHub Pages Astro CI (npm)

on:
  push:
    branches: [ astro ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'   # 可选，缓存 node_modules 加速

      - name: Install dependencies
        run: npm ci   # 使用 package-lock.json 精确安装（推荐）
        # 如果你没有 package-lock.json，可以改用 npm install

      - name: Build Astro site
        run: npm run build   # 假设你的 package.json 中有 build 脚本

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist   # Astro 默认输出目录是 dist，如果改过请对应修改

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
